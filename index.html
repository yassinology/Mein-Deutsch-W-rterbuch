<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Deutsch-Wörterbuch</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--mute:#5f6b7e;--line:#d5dbe6;--syn:#0f6f61;--synbg:#dff3ee;--ant:#9a2d5f;--antbg:#f9e3ee;--acc:#1f3a8a;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#19212f;--ink:#e8ecf4;--mute:#9aa6bb;--line:#2b3547;--syn:#6fd6c2;--synbg:#12362f;--ant:#f08ab8;--antbg:#3a1a2b;--acc:#8fa8ff;--accfg:#10151f}}
:root[data-theme="dark"]{--bg:#10151f;--card:#19212f;--ink:#e8ecf4;--mute:#9aa6bb;--line:#2b3547;--syn:#6fd6c2;--synbg:#12362f;--ant:#f08ab8;--antbg:#3a1a2b;--acc:#8fa8ff;--accfg:#10151f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.375rem;margin:4px 0 14px}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
.rtl{direction:rtl;unicode-bidi:isolate;display:inline-block}
input,select,button,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:500}
button.lnk{border:0;background:none;color:var(--mute);padding:4px 8px;font-size:0.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.big{font-size:1.875rem;font-weight:700;line-height:1.2}
.ar{font-size:1.125rem;color:var(--mute);margin-top:2px}
.note{font-size:0.875rem;color:var(--mute);margin-top:6px}
.grp{margin-top:16px;border-inline-start:4px solid var(--syn);padding-inline-start:12px}
.grp.ant{border-color:var(--ant)}
.grp h3{margin:0 0 8px;font-size:0.9375rem;color:var(--syn)}
.grp.ant h3{color:var(--ant)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;background:var(--synbg);border-radius:999px;overflow:hidden}
.ant .chip{background:var(--antbg)}
.chip button{border:0;background:none;border-radius:0;padding:6px 12px}
.chip .x{color:var(--mute);padding:6px 10px 6px 4px}
.chip small{color:var(--mute);margin-inline-start:6px}
.empty{color:var(--mute);font-size:0.875rem}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.row>button{flex:0 0 auto}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border-radius:0;border:0;border-bottom:1px solid var(--line);padding:12px 4px;background:none}
.item:last-child{border-bottom:0}
.item span.a{color:var(--mute);font-size:0.9375rem}
details summary{cursor:pointer;font-weight:700}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
label{display:block;font-size:0.875rem;color:var(--mute);margin-top:10px}
#msg{font-size:0.875rem;color:var(--syn);min-height:20px}
.fbtn{border-radius:999px;padding:6px 13px;font-size:0.875rem}
.fbtn.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.fbtn small{opacity:.75}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:0.8125rem}
[hidden]{display:none!important}
main{padding-bottom:120px}
.h2{font-size:1.125rem;margin:0 0 6px}
.big{font-family:"Newsreader",Georgia,serif}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
#catBar,#subBar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.fbtn{white-space:nowrap;flex:0 0 auto;min-height:40px}
.chip button{padding:10px 12px;min-height:44px}
.chip .x{padding:10px 14px}
.item{min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.two .grp{margin-top:0;min-width:0}
.two .chips{flex-direction:column;align-items:stretch}
.two .chip{border-radius:14px}
.two .chip button{text-align:start;flex:1}
.two .chip small{display:block;margin:0}
.gd{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-inline-end:7px;vertical-align:middle;color:#fff;font:700 11px/1 "IBM Plex Sans Arabic",system-ui,sans-serif;font-style:normal}
.g-der{background:#3558b8}.g-die{background:#b8323f}.g-das{background:#1f7a46}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;border-radius:0;background:none;min-height:54px;font-size:0.9375rem;color:var(--mute)}
#nav button.on{color:var(--acc);font-weight:700}
#fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;padding:0;font-size:1.875rem;line-height:1;background:var(--acc);color:var(--accfg);border:0;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:0.875rem;z-index:40;text-align:center}
#sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:100%;max-height:100%;padding:0;border:0;background:transparent;color:inherit;overflow:visible}
#sheet::backdrop{background:rgba(0,0,0,.45)}
.panel{max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:0.9375rem;margin-top:14px}
#conjWrap details{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#conjWrap summary{min-height:32px}
.cj{display:flex;align-items:center;gap:8px;margin-top:8px}
.cj span{flex:0 0 62px;font-size:0.8125rem;color:var(--mute)}
.cj input{padding:8px 10px;min-width:0;flex:1}
.cj-t{width:100%;border-collapse:collapse}
.cj-t td{padding:8px 4px;border-bottom:1px solid var(--line)}
.cj-t td:first-child{color:var(--mute);width:42%}

.ar{display:flex;align-items:center}
.sense{margin-top:12px}
.sense.m{border-top:1px solid var(--line);padding-top:12px}
.snum{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accfg);font-size:0.8125rem;margin-inline-end:8px}
.sr{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;margin-top:12px}
.srh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
sup{font-size:0.6875rem;margin-inline-start:2px}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h1{margin:4px 0 14px}
#themeBtn{font-size:1.25rem;min-width:44px;min-height:44px;color:var(--ink)}
.cjd{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:2px 14px}
.cjd summary{display:flex;flex-direction:column;gap:2px;min-height:48px;justify-content:center;cursor:pointer}
.cjd small{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Calm editorial theme ===== */
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--mute:#756b62;--line:#ebe4da;--syn:#2f6b57;--synbg:#e4efe8;--ant:#a3453a;--antbg:#f7e3de;--acc:#bf531a;--accfg:#fff;--sh:0 1px 2px rgba(60,40,20,.05),0 10px 28px rgba(60,40,20,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181512;--card:#221e1a;--ink:#f1ebe3;--mute:#a89d92;--line:#352f29;--syn:#8fd0b5;--synbg:#223a31;--ant:#f1a597;--antbg:#43241e;--acc:#f08a4b;--accfg:#1b1209;--sh:0 0 0 1px #352f29}}
:root[data-theme="dark"]{--bg:#181512;--card:#221e1a;--ink:#f1ebe3;--mute:#a89d92;--line:#352f29;--syn:#8fd0b5;--synbg:#223a31;--ant:#f1a597;--antbg:#43241e;--acc:#f08a4b;--accfg:#1b1209;--sh:0 0 0 1px #352f29}
body{line-height:1.65;-webkit-font-smoothing:antialiased}
main{max-width:600px;padding:26px 20px 140px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.75rem;letter-spacing:-.01em}
.hd h1{margin:2px 0 18px}
.card{border:0;border-radius:24px;box-shadow:var(--sh);padding:24px;margin:20px 0}
input,select,textarea{border-radius:16px;padding:14px 16px}
input[type=search]{border-radius:999px;padding:14px 20px;box-shadow:var(--sh);border-color:transparent}
button{border-radius:999px;padding:11px 20px}
button.pri{font-weight:600}
button.lnk{border:0;box-shadow:none}
.fbtn{background:transparent;color:var(--mute);padding:7px 16px}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#list{padding:6px 22px}
.item{padding:17px 0;min-height:56px}
.item b{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.2rem}
.item span.a{font-size:1rem}
.big{font-size:2.5rem;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.ar{font-size:1.25rem;margin-top:6px}
.grp{border-inline-start:0;padding-inline-start:0;margin-top:22px}
.grp h3{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.sense.m{margin-top:24px;padding-top:22px}
.chip{border-radius:999px}
.two .chip{border-radius:18px}
.cjd{border:0;background:var(--bg);border-radius:18px;padding:4px 18px;margin-top:22px}
.panel{border-radius:28px 28px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px))}
.sr{border-radius:16px}
#nav{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#nav button{border-radius:0;padding:0}
#fab{box-shadow:0 12px 26px rgba(191,83,26,.32);bottom:calc(76px + env(safe-area-inset-bottom,0px))}
label{margin-top:16px}
.note{line-height:1.6}
#catBar{scrollbar-width:none}
#catBar::-webkit-scrollbar{display:none}
.sbw{padding:10px 0 4px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.sbar{position:relative;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.sbar i{position:absolute;top:0;bottom:0;left:0;width:30%;border-radius:999px;background:var(--acc);cursor:grab}
</style>
</head>
<body>
<main>
<div class="hd"><h1>Mein Deutsch-Wörterbuch</h1><button id="themeBtn" class="lnk" aria-label="Design wechseln">◐</button></div>
<div class="note" id="sync" role="status" style="margin:-8px 0 10px"></div>

<section id="vList">
<div class="sticky"><input id="q" type="search" placeholder="Wort suchen (Deutsch oder Arabisch)" autocomplete="off" aria-label="Suche"></div>
<div class="chips" id="catBar" style="margin-top:8px"></div>
<div class="sbw" id="catSb" hidden aria-hidden="true"><div class="sbar"><i></i></div></div>
<div class="chips" id="subBar" style="margin-top:8px"></div>
<div class="card" id="list"></div>
</section>

<section id="vWord" hidden>
<button class="lnk" id="back">← Zurück</button>
<div id="detail"></div>
</section>

<section id="vMore" hidden>
<div class="card"><h2 class="h2">Konto &amp; Sync</h2><div id="acctBody"></div></div>
<div class="card"><h2 class="h2">Kategorien verwalten</h2>
<div id="catList"></div>
<label for="ncat">Name der neuen Kategorie</label>
<div class="row"><input id="ncat" dir="ltr" placeholder="z.B. Trennbare Verben"><button class="pri" id="addCat">Hinzufügen</button></div>
</div>
<div class="card"><h2 class="h2">Backup</h2>
<div class="bar" style="margin-top:0"><button id="exp">Backup exportieren</button><button id="imp">Backup importieren</button><input type="file" id="file" accept=".json" hidden></div>
<details style="margin-top:12px"><summary>Backup als Text</summary>
<p class="note">Falls die Datei nicht gespeichert werden kann: „Backup anzeigen“ wählen, den Text kopieren und aufbewahren. Zum Wiederherstellen hier einfügen und „Aus Text importieren“ wählen.</p>
<textarea id="bkText" rows="5" dir="ltr" aria-label="Backup-Text"></textarea>
<div class="row"><button id="bkShow">Backup anzeigen</button><button class="pri" id="bkImp">Aus Text importieren</button></div>
</details></div>
<p class="note" id="count"></p>
</section>
</main>

<button id="fab" aria-label="Neues Wort hinzufügen">+</button>
<div id="toast" role="status" hidden></div>
<nav id="nav"><button id="nList" class="on">Wörter</button><button id="nMore">Mehr</button></nav>

<dialog id="sheet" aria-labelledby="addTitle">
<div class="panel">
<h2 class="h2" id="addTitle">Neues Wort hinzufügen</h2>
<label for="fde">Deutsches Wort</label>
<input id="fde" dir="ltr" placeholder="z.B. der Hund">
<div id="senseWrap"></div>
<button type="button" class="lnk" id="addSense">+ Weitere Bedeutung</button>
<label for="fcat">Kategorie</label>
<select id="fcat"></select>
<div id="subWrap" hidden><label for="fsub">Unterkategorie</label>
<select id="fsub"></select></div>
<label class="chk"><input type="checkbox" id="fverb"> Das ist ein Verb (mit Konjugation)</label>
<div id="conjWrap" hidden></div>
<div class="row"><button class="pri" id="save">Wort speichern</button><button id="cancel">Abbrechen</button></div>
<div id="msg" role="status"></div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
// ===== Supabase-Einstellungen: hier eintragen =====
var SUPABASE_URL="https://qjyvqgyfolbhpygvbtry.supabase.co";   // z.B. https://abcdxyz.supabase.co
var SUPABASE_KEY="sb_publishable_e2mzd27xSmamKbJDwVoJ8Q_tRg7R9Fo";   // Publishable key: sb_publishable_...
// ==================================================
var sb=null,session=null;
var words=[],links=[],cats=null,filterCat="",filterSub="",sel=null,editId=null;
var DEF=["Nomen","Verben","Reflexive Verben","Adjektive","Adverbien","Präpositionen"];
function defCats(){return DEF.map(function(n,i){return{id:"c"+i,name:n}})}
var KEY="german-words-v1";
var stamp=0,cloud=null,userId=null,dirty=false,busy=false,timer=null,base="";
function snap(){return{words:words,links:links,cats:cats,t:stamp}}
function applyData(d){words=d.words||[];links=d.links||[];cats=d.cats||defCats();stamp=d.t||0;migrate()}
function setSync(t){base=t;$("sync").textContent=t}
function flashUndo(t,fn){
  var el=$("toast");el.textContent=t+" ";
  var b=document.createElement("button");b.className="lnk";b.textContent="Rückgängig";b.style.cssText="color:inherit;text-decoration:underline;padding:4px 6px";
  b.onclick=function(){el.hidden=true;fn()};
  el.appendChild(b);el.hidden=false;clearTimeout(ft);ft=setTimeout(function(){el.hidden=true},6000);
}
function flash(t){var el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(ft);ft=setTimeout(function(){el.hidden=true},3500)}
function local(){try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(r)applyData(JSON.parse(r))}catch(e){}if(!cats)cats=defCats()}
function save(){
  stamp=Date.now();local();
  if(!cloud||!synced){setSync(cloud?"Noch nicht mit dem Konto synchronisiert":"Nur auf diesem Gerät gespeichert");return}
  dirty=true;setSync("Wird gespeichert …");clearTimeout(timer);timer=setTimeout(push,700);
}
var synced=false,lastSync="",pushErr=false;
function info(t,err){var el=$("syncInfo");if(el){el.textContent=t;el.style.color=err?"var(--ant)":"var(--mute)"}}
function errText(e){
  var m=(e&&e.message)||String(e),c=e&&e.code;
  if(c==="42P01"||/does not exist|schema cache/i.test(m))return "Die Tabelle „dictionaries“ fehlt. Führe das SQL aus Schritt 2 im Supabase SQL Editor aus. ("+m+")";
  if(/permission denied for table/i.test(m))return "Es fehlt die Berechtigung (GRANT) für die Tabelle. Führe im Supabase SQL Editor aus: grant select, insert, update, delete on public.dictionaries to authenticated;  ("+m+")";
  if(c==="42501"||/row-level security/i.test(m))return "Zugriff verweigert: Die RLS-Policy fehlt oder ist falsch. Führe das SQL für die Policy erneut aus. ("+m+")";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Keine Verbindung zu Supabase. Prüfe Internet und SUPABASE_URL.";
  if(/api key|apikey/i.test(m))return "Ungültiger Schlüssel. Prüfe SUPABASE_KEY.";
  return m;
}
function done(t){lastSync=new Date().toLocaleTimeString();setSync("In deinem Konto und auf diesem Gerät gespeichert");info(t+" ("+lastSync+")")}
async function push(){
  if(busy)return;
  busy=true;pushErr=false;
  try{
    while(dirty){
      dirty=false;
      var r=await sb.from("dictionaries").upsert({user_id:userId,data:snap(),updated_at:new Date().toISOString()});
      if(r.error)throw r.error;
    }
    setSync("In deinem Konto und auf diesem Gerät gespeichert");info("Gespeichert ("+new Date().toLocaleTimeString()+")");
  }catch(e){dirty=false;pushErr=true;setSync("Speichern im Konto fehlgeschlagen, die Daten sind auf diesem Gerät gespeichert");info(errText(e),true)}
  busy=false;
}
async function pull(){
  setSync("Verbinde mit Konto …");info("Synchronisiere …");
  try{
    var r=await sb.from("dictionaries").select("data").maybeSingle();
    if(r.error)throw r.error;
    var remote=r.data?r.data.data:null;
    cloud=sb;synced=true;
    if(remote&&(remote.t||0)>stamp){applyData(remote);local();render();done("Aus dem Konto geladen: "+words.length+" Wörter")}
    else if(words.length&&(!remote||stamp>(remote.t||0))){if(!stamp){stamp=Date.now();local()}dirty=true;setSync("Wird gespeichert …");await push();if(!pushErr)done("Ins Konto hochgeladen: "+words.length+" Wörter")}
    else done("Bereits aktuell: "+words.length+" Wörter");
  }catch(e){cloud=null;synced=false;setSync("Nicht mit dem Konto synchronisiert");info(errText(e),true)}
}
async function mergeSync(){
  info("Führe zusammen …");
  try{
    var r=await sb.from("dictionaries").select("data").maybeSingle();
    if(r.error)throw r.error;
    cloud=sb;synced=true;
    if(r.data&&r.data.data)mergeIn(r.data.data);
    stamp=Date.now();local();dirty=true;render();
    await push();
    if(!pushErr)done("Zusammengeführt: "+words.length+" Wörter");
  }catch(e){info(errText(e),true)}
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&sb&&session&&!$("sheet").open&&!busy)pull();
});
function onSession(ev,s){
  if(ev==="TOKEN_REFRESHED"){session=s;return}
  session=s;renderAcct();
  if(s){userId=s.user.id;pull()}
  else{cloud=null;synced=false;userId=null;setSync("Nur auf diesem Gerät gespeichert. Unter „Mehr“ anmelden, um zu synchronisieren.")}
}
function authMsg(t){var el=$("aMsg");if(el)el.textContent=t}
function renderAcct(){
  var el=$("acctBody");
  if(!sb){el.innerHTML='<p class="note">Sync ist nicht eingerichtet. Trage SUPABASE_URL und SUPABASE_KEY am Anfang des Skripts ein.</p>';return}
  if(session){el.innerHTML='<p class="note">Angemeldet als <b class="de">'+esc(session.user.email||"")+'</b></p><div class="row"><button class="pri" id="aSync">Jetzt synchronisieren</button><button id="aMerge">Zusammenführen</button></div><div class="note" id="syncInfo" role="status" style="margin-top:10px"></div><p class="note" style="font-size:0.8125rem">„Jetzt synchronisieren“ übernimmt den neueren Stand (Gerät oder Konto). „Zusammenführen“ vereint beide Stände. Gelöschte Wörter können dabei wiederkommen.</p><div class="row"><button id="aOut">Abmelden</button></div>';return}

function mergeIn(d){

  var cmap={},smap={},sm={},nw=0;
  (d.cats||[]).forEach(function(c){
    var m=cats.find(function(x){return norm(x.name)===norm(c.name)});
    if(!m){m={id:uid(),name:c.name};cats.push(m)}
    cmap[c.id]=m.id;
    m.subs=m.subs||[];
    (c.subs||[]).forEach(function(sc){var ms=m.subs.find(function(x){return norm(x.name)===norm(sc.name)});if(!ms){ms={id:uid(),name:sc.name};m.subs.push(ms)}smap[sc.id]=ms.id});
  });
  d.words.forEach(function(w){
    if(!w||!w.de)return;
    var iss=w.senses||[{id:w.id,ar:w.ar||"",note:w.note||""}];
    var ex=findDe(w.de);
    if(ex){
      if(!ex.cat&&cmap[w.cat]){ex.cat=cmap[w.cat];ex.sub=smap[w.sub]||""}
      if(!ex.verb&&w.verb){ex.verb=true;ex.conj=w.conj||null}
      iss.forEach(function(s){
        var m=ex.senses.find(function(x){return x.ar&&x.ar===s.ar})||ex.senses.find(function(x){return !x.ar&&!x.note});
        if(m){if(!m.ar&&!m.note){m.ar=s.ar||"";m.note=s.note||""}}
        else{m={id:uid(),ar:s.ar||"",note:s.note||""};ex.senses.push(m)}
        sm[s.id]=m.id;
      });
      return;
    }
    var n={id:uid(),de:w.de,cat:cmap[w.cat]||"",sub:smap[w.sub]||"",verb:!!w.verb,conj:w.conj||null,senses:iss.map(function(s){var id=uid();sm[s.id]=id;return{id:id,ar:s.ar||"",note:s.note||""}})};
    words.push(n);nw++;
  });
  (d.links||[]).forEach(function(l){
    var a=sm[l.a],b=sm[l.b];
    if(!a||!b||a===b)return;
    var has=links.some(function(x){return x.type===l.type&&((x.a===a&&x.b===b)||(x.a===b&&x.b===a))});
    if(!has)links.push({a:a,b:b,type:l.type});
  });
  return nw;
}

      return '<div class="cj"><span class="de">'+P3[i]+'</span><input dir="ltr" data-t="'+t[0]+'" data-i="'+i+'" placeholder="'+ph+'" aria-label="'+t[1]+' '+P3[i]+'" autocomplete="off"></div>';
    }).join("")+'</details>';
  }).join("");
}
function readConj(){
  var c={},any=false;
  document.querySelectorAll("#conjWrap input").forEach(function(el){
    var t=el.dataset.t,i=+el.dataset.i,v=el.value.trim();
    if(!c[t])c[t]=["","",""];
    c[t][i]=v;if(v)any=true;
  });
  return any?c:null;
}
function fillConj(c){
  document.querySelectorAll("#conjWrap input").forEach(function(el){
    el.value=c3(c&&c[el.dataset.t])[+el.dataset.i]||"";
  });
  document.querySelectorAll("#conjWrap details").forEach(function(d){
    d.open=Array.prototype.some.call(d.querySelectorAll("input"),function(x){return x.value});
  });
}
function forms(w){
  if(!w.conj)return "";
  return Object.keys(w.conj).map(function(k){return c3(w.conj[k]).join(" ")}).join(" ");
}
function conjHtml(w){
  if(!w.verb)return "";
  var rows=[],sum=[];
  TENSES.forEach(function(t){
    var f=c3(w.conj&&w.conj[t[0]]),parts=TP[t[0]].map(function(i){return pf(f[i],i)}).filter(Boolean);
    if(parts.length){rows.push('<tr><td>'+t[1]+'</td><td class="de">'+esc(parts.join(", "))+'</td></tr>');if(t[0]!=="k2")sum.push(parts.join(", "))}
  });
  if(!rows.length)return "";
  return '<details class="cjd"><summary><b>Konjugation</b><small class="de">'+esc(sum.join(" · "))+'</small></summary><table class="cj-t"><tr><td>Infinitiv</td><td class="de">'+esc(w.de)+'</td></tr>'+rows.join("")+'</table></details>';
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.fc!==undefined){filterCat=t.dataset.fc;filterSub="";render();return}
  if(t.dataset.ct){conjTab=t.dataset.ct;renderDetail();return}
  if(t.dataset.fs!==undefined){filterSub=t.dataset.fs;render();return}
  if(t.dataset.delcat){
    if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Wirklich löschen?";return}
    var cid=t.dataset.delcat;
    cats=cats.filter(function(c){return c.id!==cid});
    words.forEach(function(w){if(w.cat===cid){w.cat="";w.sub=""}});
    if(filterCat===cid){filterCat="";filterSub=""}
    save();render();return;
  }
  if(t.dataset.delsub){
    var ps=t.dataset.delsub.split("|"),cc=cats.find(function(x){return x.id===ps[0]});
    if(cc)cc.subs=(cc.subs||[]).filter(function(x){return x.id!==ps[1]});
    words.forEach(function(w){if(w.sub===ps[1])w.sub=""});
    if(filterSub===ps[1])filterSub="";
    save();render();return;
  }
  if(t.dataset.addsub){
    var cc2=cats.find(function(x){return x.id===t.dataset.addsub}),inp=document.querySelector('[data-subin="'+t.dataset.addsub+'"]');
    var nm2=inp?inp.value.trim():"";if(!cc2||!nm2)return;
    cc2.subs=cc2.subs||[];
    if(!cc2.subs.some(function(x){return norm(x.name)===norm(nm2)}))cc2.subs.push({id:uid(),name:nm2});
    save();render();return;
  }
  if(t.id==="addCat"){
    var nm=$("ncat").value.trim();if(!nm)return;
    if(!cats.some(function(c){return norm(c.name)===norm(nm)}))cats.push({id:uid(),name:nm});
    $("ncat").value="";save();render();return;
  }
  if(t.id==="emptyAdd"){resetForm();openSheet();return}
  if(t.dataset.rmsense){t.closest(".sr").remove();renumber();return}
  if(t.id==="addSense"){addSenseRow(null);return}
  if(t.dataset.go){goWord(t.dataset.go);return}
  if(t.dataset.unlink){
    var p=t.dataset.unlink.split("|");
    links=links.filter(function(l){return !(l.type===p[2]&&((l.a===p[0]&&l.b===p[1])||(l.b===p[0]&&l.a===p[1])))});
    save();render();return;
  }
  if(t.id==="addLink"){
    var v=$("ldst").value.trim();if(!v)return;
    var type=$("ltype").value,dst=findDe(v),cw=byId(sel);
    var mine=$("lmine")?$("lmine").value:cw.senses[0].id;
    if(!dst){dst={id:uid(),de:v,cat:"",sub:"",senses:[{id:uid(),ar:"",note:""}]};words.push(dst)}
    var tid=(!$("ltsense").hidden&&$("ltsense").value)||dst.senses[0].id;
    if(tid===mine)return;
    var exists=links.some(function(l){return l.type===type&&((l.a===mine&&l.b===tid)||(l.b===mine&&l.a===tid))});
    if(!exists)links.push({a:mine,b:tid,type:type});
    save();render();return;
  }
  if(t.id==="del"){
    var snapJ=JSON.stringify({words:words,links:links}),delId=sel;
    var dw=byId(sel),dids=dw?dw.senses.map(function(x){return x.id}):[];links=links.filter(function(l){return dids.indexOf(l.a)<0&&dids.indexOf(l.b)<0});
    words=words.filter(function(w){return w.id!==sel});sel=null;save();go("");flashUndo("Wort gelöscht",function(){var d=JSON.parse(snapJ);words=d.words;links=d.links;save();goWord(delId)});return;
  }
  if(t.id==="edit"){
    var w=byId(sel);editId=w.id;$("fde").value=w.de;fillSenses(w.senses);$("fcat").value=w.cat||"";fillSubs(w.cat||"",w.sub||"");$("fverb").checked=!!w.verb;$("conjWrap").hidden=!w.verb;fillConj(w.conj);
    $("addTitle").textContent="Wort bearbeiten";openSheet();
  }
});

function syncBar(){
  var c=$("catBar"),b=$("catSb"),t=b.querySelector("i"),sw=c.scrollWidth,cw=c.clientWidth;
  if(sw<=cw+1){b.hidden=true;return}
  b.hidden=false;t.style.width=(cw/sw*100)+"%";t.style.left=(c.scrollLeft/sw*100)+"%";
}
$("catBar").addEventListener("scroll",syncBar,{passive:true});
window.addEventListener("resize",syncBar);
var sbDrag=null;
function sbMove(x){
  var c=$("catBar"),tr=$("catSb").querySelector(".sbar").getBoundingClientRect(),sw=c.scrollWidth,cw=c.clientWidth,tw=tr.width*cw/sw;
  var left=Math.min(Math.max(x-tr.left-sbDrag,0),tr.width-tw);
  c.scrollLeft=left/tr.width*sw;
}
$("catSb").addEventListener("pointerdown",function(e){
  var th=this.querySelector("i").getBoundingClientRect();
  sbDrag=(e.clientX>=th.left&&e.clientX<=th.right)?e.clientX-th.left:th.width/2;
  try{this.setPointerCapture(e.pointerId)}catch(x){}
  sbMove(e.clientX);e.preventDefault();
});
$("catSb").addEventListener("pointermove",function(e){if(sbDrag!==null)sbMove(e.clientX)});
["pointerup","pointercancel"].forEach(function(n){$("catSb").addEventListener(n,function(){sbDrag=null})});
$("catBar").addEventListener("wheel",function(e){
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  var max=this.scrollWidth-this.clientWidth;
  if(max<=0)return;
  var next=this.scrollLeft+e.deltaY;
  if((next<0&&this.scrollLeft<=0)||(next>max&&this.scrollLeft>=max))return;
  this.scrollLeft=next;e.preventDefault();
},{passive:false});
var THEMES=["auto","light","dark"],ICON={auto:"◐",light:"☀",dark:"☾"},LBL={auto:"Design: automatisch",light:"Design: hell",dark:"Design: dunkel"};

  var b=$("themeBtn");b.textContent=ICON[t];b.setAttribute("aria-label",LBL[t]);b.dataset.t=t;

}
